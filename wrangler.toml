# yondr-ad-portal: the Yondr ad library at https://ads.overyondrdev.com (repo Overyondrdev/digital-ads-portal).
# Sign-in: the Yondr Google sign-in (auth.overyondrdev.com); Cloudflare Access is Bypass for this host.
name = "yondr-ad-portal"
main = "src/index.ts"
compatibility_date = "2026-11-01"
account_id = "3fac6c19097c5692e17198cffa818085"

# No public *.workers.dev or preview URLs: they would bypass the sign-in.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ads.overyondrdev.com", custom_domain = true }
]

# The app's files (public/) are bundled into the script and served by src/static.ts.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/app.js", "**/render.js", "**/editor.js", "**/tour.js", "**/help.js", "**/help-content.js", "**/*.svg", "**/*.txt"]
fallthrough = false

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false

[vars]
# Public key of the Yondr Google sign-in (auth.overyondrdev.com) that signs the shared session cookie. Safe to commit.
YONDR_AUTH_PUBLIC_JWK = '{"kty":"EC","crv":"P-256","x":"BpCjLJMykOsJbtPTm63rdbw2BzRUTNTz3jj9LWqK6AM","y":"RyW0y7Dki1BQ6GnYdD-4FPovGYfoaMmDgr21lNU7xXQ","kid":"yondr-2026-11-26-a3a7e6"}'
ALLOWED_EMAIL_DOMAINS = "overyondr.com"
# Roles (src/roles.ts): everyone who signs in starts as DEFAULT_ROLE. Owners (always admins) are the OWNER_EMAILS
# secret, not a var, so personal emails stay out of the repo: npx wrangler -c wrangler.toml secret put OWNER_EMAILS
DEFAULT_ROLE = "viewer"

[observability]
enabled = true

[[r2_buckets]]
binding = "AD_ASSETS"
bucket_name = "yondr-ad-portal-assets"

[[d1_databases]]
binding = "DB"
database_name = "yondr-ad-portal-db"
database_id = "dfdcc2cc-4505-4ff7-944a-1fcd52abb04d"
migrations_dir = "migrations"
